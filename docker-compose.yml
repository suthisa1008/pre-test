services:
  postgres:
    image: postgres:16-alpine
    container_name: product-postgres
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: product
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - product_pg_data:/var/lib/postgresql/data

volumes:
  product_pg_data:
